<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hunyuan3D Client</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f9;
        --panel: #ffffff;
        --ink: #15171a;
        --muted: #68707d;
        --line: #d9dee7;
        --accent: #1565c0;
        --accent-dark: #0d47a1;
        --danger: #b3261e;
        --ok: #1b7f42;
        --shadow: 0 10px 30px rgba(20, 25, 35, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button,
      input {
        font: inherit;
      }

      .app {
        width: min(1180px, calc(100vw - 32px));
        margin: 0 auto;
        padding: 28px 0 36px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
      }

      .status-pill {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 14px;
      }

      .status-pill.ok {
        border-color: rgba(27, 127, 66, 0.25);
        color: var(--ok);
      }

      .status-pill.error {
        border-color: rgba(179, 38, 30, 0.25);
        color: var(--danger);
      }

      .layout {
        display: grid;
        grid-template-columns: 410px 1fr;
        gap: 18px;
        align-items: start;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .panel-inner {
        padding: 18px;
      }

      .section-title {
        margin: 0 0 12px;
        font-size: 15px;
        font-weight: 700;
      }

      .field {
        display: grid;
        gap: 6px;
        margin-bottom: 12px;
      }

      label {
        color: var(--muted);
        font-size: 13px;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 0 10px;
        color: var(--ink);
        background: #fff;
      }

      input[type="text"]:focus,
      input[type="password"]:focus {
        outline: 2px solid rgba(21, 101, 192, 0.18);
        border-color: var(--accent);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 118px;
        gap: 10px;
      }

      .dropzone {
        display: grid;
        place-items: center;
        min-height: 172px;
        border: 1.5px dashed #aeb7c4;
        border-radius: 8px;
        background: #fbfcfe;
        color: var(--muted);
        text-align: center;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          background 0.15s ease,
          color 0.15s ease;
      }

      .dropzone.dragover {
        border-color: var(--accent);
        background: #edf5ff;
        color: var(--accent-dark);
      }

      .dropzone strong {
        display: block;
        color: var(--ink);
        font-size: 15px;
        margin-bottom: 4px;
      }

      .file-meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 13px;
        word-break: break-word;
      }

      .image-preview {
        display: none;
        margin-top: 12px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 8px;
        background:
          linear-gradient(45deg, #e6eaf0 25%, transparent 25%),
          linear-gradient(-45deg, #e6eaf0 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #e6eaf0 75%),
          linear-gradient(-45deg, transparent 75%, #e6eaf0 75%);
        background-color: #f8fafc;
        background-position:
          0 0,
          0 10px,
          10px -10px,
          -10px 0;
        background-size: 20px 20px;
      }

      .image-preview img {
        display: block;
        width: 100%;
        max-height: 260px;
        object-fit: contain;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .button {
        min-height: 40px;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 0 14px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
        font-weight: 650;
      }

      .button:hover {
        background: var(--accent-dark);
      }

      .button.secondary {
        background: #fff;
        border-color: var(--line);
        color: var(--ink);
      }

      .button.secondary:hover {
        background: #f2f5f8;
      }

      .button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .viewer-wrap {
        min-height: 610px;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .viewer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--line);
        padding: 14px 16px;
      }

      .job-id {
        color: var(--muted);
        font-size: 13px;
        word-break: break-all;
      }

      model-viewer {
        width: 100%;
        min-height: 540px;
        background: radial-gradient(circle at 50% 35%, #6b7280 0%, #242b36 62%, #121722 100%);
        border-radius: 0 0 8px 8px;
      }

      .empty-viewer {
        display: grid;
        place-items: center;
        min-height: 540px;
        color: var(--muted);
        background: radial-gradient(circle at 50% 35%, #6b7280 0%, #242b36 62%, #121722 100%);
        border-radius: 0 0 8px 8px;
        text-align: center;
        padding: 18px;
      }

      .log {
        min-height: 120px;
        max-height: 220px;
        overflow: auto;
        border-top: 1px solid var(--line);
        background: #111827;
        color: #d1d5db;
        font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
        font-size: 12px;
        line-height: 1.5;
        padding: 12px;
        white-space: pre-wrap;
      }

      .metrics {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
        margin-top: 12px;
      }

      .metric {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fbfcfe;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 4px;
      }

      .metric strong {
        font-size: 16px;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .row,
        .metrics {
          grid-template-columns: 1fr;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <h1>Hunyuan3D Client</h1>
        <div id="serverStatus" class="status-pill">Сервер не проверен</div>
      </div>

      <div class="layout">
        <section class="panel">
          <div class="panel-inner">
            <h2 class="section-title">Подключение</h2>
            <div class="field">
              <label for="serverUrl">Адрес API</label>
              <input id="serverUrl" type="text" value="http://159.48.242.5:56849" />
            </div>
            <div class="field">
              <label for="apiKey">API key</label>
              <input id="apiKey" type="password" value="change-me" />
            </div>
            <div class="actions">
              <button id="checkHealth" class="button secondary" type="button">Проверить сервер</button>
            </div>
          </div>

          <div class="panel-inner" style="border-top: 1px solid var(--line)">
            <h2 class="section-title">Изображение</h2>
            <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
            <div id="dropzone" class="dropzone" tabindex="0" role="button">
              <div>
                <strong>Перетащите изображение сюда</strong>
                <span>или нажмите, чтобы выбрать файл</span>
              </div>
            </div>
            <div id="fileMeta" class="file-meta">Файл не выбран</div>
            <div id="imagePreview" class="image-preview">
              <img id="imagePreviewImg" alt="Предпросмотр изображения" />
            </div>

            <div class="actions">
              <button id="startJob" class="button" type="button" disabled>Начать генерацию</button>
              <button id="clearFile" class="button secondary" type="button" disabled>Очистить</button>
            </div>
          </div>

          <div class="log" id="log"></div>
        </section>

        <section class="panel viewer-wrap">
          <div class="viewer-head">
            <div>
              <div class="section-title" style="margin: 0">Результат</div>
              <div id="jobId" class="job-id">Задача еще не создана</div>
            </div>
            <a id="downloadLink" class="button secondary" href="#" download="result.glb" style="display: none; text-decoration: none">Скачать GLB</a>
          </div>

          <div id="viewerSlot" class="empty-viewer">
            После генерации здесь появится 3D-модель.
          </div>

          <div id="metrics" class="metrics" style="display: none"></div>
        </section>
      </div>
    </main>

    <script>
      const elements = {
        serverUrl: document.getElementById("serverUrl"),
        apiKey: document.getElementById("apiKey"),
        checkHealth: document.getElementById("checkHealth"),
        serverStatus: document.getElementById("serverStatus"),
        fileInput: document.getElementById("fileInput"),
        dropzone: document.getElementById("dropzone"),
        fileMeta: document.getElementById("fileMeta"),
        imagePreview: document.getElementById("imagePreview"),
        imagePreviewImg: document.getElementById("imagePreviewImg"),
        startJob: document.getElementById("startJob"),
        clearFile: document.getElementById("clearFile"),
        log: document.getElementById("log"),
        jobId: document.getElementById("jobId"),
        viewerSlot: document.getElementById("viewerSlot"),
        downloadLink: document.getElementById("downloadLink"),
        metrics: document.getElementById("metrics"),
      };

      const storageKeys = {
        serverUrl: "hy3d.client.serverUrl",
        apiKey: "hy3d.client.apiKey",
      };

      let selectedFile = null;
      let currentJobId = null;
      let currentResultUrl = null;
      let currentImagePreviewUrl = null;
      let pollTimer = null;

      function normalizeBaseUrl() {
        return elements.serverUrl.value.trim().replace(/\/+$/, "");
      }

      function headers() {
        const key = elements.apiKey.value.trim();
        return key ? { "X-API-Key": key } : {};
      }

      function saveSettings() {
        localStorage.setItem(storageKeys.serverUrl, elements.serverUrl.value.trim());
        localStorage.setItem(storageKeys.apiKey, elements.apiKey.value.trim());
      }

      function loadSettings() {
        const savedServerUrl = localStorage.getItem(storageKeys.serverUrl);
        const savedApiKey = localStorage.getItem(storageKeys.apiKey);
        if (savedServerUrl) elements.serverUrl.value = savedServerUrl;
        if (savedApiKey) elements.apiKey.value = savedApiKey;
      }

      function writeLog(message) {
        const time = new Date().toLocaleTimeString();
        elements.log.textContent += `[${time}] ${message}\n`;
        elements.log.scrollTop = elements.log.scrollHeight;
      }

      function setServerStatus(text, state) {
        elements.serverStatus.textContent = text;
        elements.serverStatus.className = `status-pill ${state || ""}`.trim();
      }

      function setBusy(isBusy) {
        elements.startJob.disabled = isBusy || !selectedFile;
        elements.checkHealth.disabled = isBusy;
        elements.clearFile.disabled = isBusy || !selectedFile;
      }

      function selectFile(file) {
        selectedFile = file;
        if (currentImagePreviewUrl) {
          URL.revokeObjectURL(currentImagePreviewUrl);
          currentImagePreviewUrl = null;
        }
        if (!file) {
          elements.fileMeta.textContent = "Файл не выбран";
          elements.imagePreview.style.display = "none";
          elements.imagePreviewImg.removeAttribute("src");
          elements.startJob.disabled = true;
          elements.clearFile.disabled = true;
          return;
        }
        const sizeMb = (file.size / 1024 / 1024).toFixed(2);
        elements.fileMeta.textContent = `${file.name} · ${sizeMb} MB`;
        currentImagePreviewUrl = URL.createObjectURL(file);
        elements.imagePreviewImg.src = currentImagePreviewUrl;
        elements.imagePreview.style.display = "block";
        elements.startJob.disabled = false;
        elements.clearFile.disabled = false;
      }

      async function checkHealth() {
        saveSettings();
        const baseUrl = normalizeBaseUrl();
        setServerStatus("Проверка...", "");
        try {
          const response = await fetch(`${baseUrl}/health`, { method: "GET" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          await response.json();
          setServerStatus("Сервер доступен", "ok");
          writeLog("Сервер доступен.");
        } catch (error) {
          setServerStatus("Сервер недоступен", "error");
          writeLog(`Ошибка проверки сервера: ${error.message}`);
        }
      }

      async function startJob() {
        if (!selectedFile) return;
        saveSettings();
        setBusy(true);
        clearResult();

        const formData = new FormData();
        formData.append("image", selectedFile, selectedFile.name);
        writeLog("Отправка изображения на сервер...");

        try {
          const response = await fetch(`${normalizeBaseUrl()}/jobs`, {
            method: "POST",
            headers: headers(),
            body: formData,
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          const job = await response.json();
          currentJobId = job.job_id;
          elements.jobId.textContent = `Job ID: ${currentJobId}`;
          writeLog(`Задача создана: ${currentJobId}`);
          pollJob();
        } catch (error) {
          writeLog(`Не удалось создать задачу: ${error.message}`);
          setBusy(false);
        }
      }

      async function pollJob() {
        if (!currentJobId) return;
        window.clearTimeout(pollTimer);

        try {
          const response = await fetch(`${normalizeBaseUrl()}/jobs/${currentJobId}`, {
            headers: headers(),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          const job = await response.json();
          writeLog(`Статус: ${job.status}`);

          if (job.status === "done") {
            await loadResult(currentJobId);
            await loadMetrics(currentJobId);
            setBusy(false);
            return;
          }

          if (job.status === "failed") {
            writeLog(`Ошибка генерации: ${job.error || "неизвестная ошибка"}`);
            setBusy(false);
            return;
          }

          pollTimer = window.setTimeout(pollJob, 3000);
        } catch (error) {
          writeLog(`Ошибка запроса статуса: ${error.message}`);
          pollTimer = window.setTimeout(pollJob, 5000);
        }
      }

      async function loadResult(jobId) {
        writeLog("Загрузка GLB результата...");
        const response = await fetch(`${normalizeBaseUrl()}/jobs/${jobId}/result`, {
          headers: headers(),
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        const blob = await response.blob();
        if (currentResultUrl) URL.revokeObjectURL(currentResultUrl);
        currentResultUrl = URL.createObjectURL(blob);

        elements.downloadLink.href = currentResultUrl;
        elements.downloadLink.download = `${jobId}.glb`;
        elements.downloadLink.style.display = "inline-flex";

        elements.viewerSlot.className = "";
        elements.viewerSlot.innerHTML = `
          <model-viewer
            src="${currentResultUrl}"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="0.9"
            environment-image="neutral"
            ar
          ></model-viewer>
        `;
        writeLog("Результат загружен.");
      }

      async function loadMetrics(jobId) {
        try {
          const response = await fetch(`${normalizeBaseUrl()}/jobs/${jobId}/metrics`, {
            headers: headers(),
          });
          if (!response.ok) return;
          const metrics = await response.json();
          renderMetrics(metrics);
        } catch (error) {
          writeLog(`Метрики недоступны: ${error.message}`);
        }
      }

      function renderMetrics(metrics) {
        const items = [
          ["Score", metrics.quality_score_0_100],
          ["Vertices", metrics.vertices],
          ["Faces", metrics.faces],
          ["Watertight", metrics.is_watertight],
          ["Components", metrics.components],
          ["Boundary ratio", formatNumber(metrics.boundary_edge_ratio)],
        ];
        elements.metrics.innerHTML = items
          .map(([label, value]) => `<div class="metric"><span>${label}</span><strong>${value ?? "n/a"}</strong></div>`)
          .join("");
        elements.metrics.style.display = "grid";
      }

      function formatNumber(value) {
        if (value === null || value === undefined) return "n/a";
        if (typeof value !== "number") return value;
        return value.toFixed(4);
      }

      function clearResult() {
        if (currentResultUrl) {
          URL.revokeObjectURL(currentResultUrl);
          currentResultUrl = null;
        }
        elements.downloadLink.style.display = "none";
        elements.metrics.style.display = "none";
        elements.metrics.innerHTML = "";
        elements.viewerSlot.className = "empty-viewer";
        elements.viewerSlot.textContent = "После генерации здесь появится 3D-модель.";
      }

      elements.serverUrl.addEventListener("change", saveSettings);
      elements.apiKey.addEventListener("change", saveSettings);
      elements.checkHealth.addEventListener("click", checkHealth);
      elements.startJob.addEventListener("click", startJob);
      elements.clearFile.addEventListener("click", () => {
        elements.fileInput.value = "";
        selectFile(null);
      });

      elements.dropzone.addEventListener("click", () => elements.fileInput.click());
      elements.dropzone.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") elements.fileInput.click();
      });
      elements.fileInput.addEventListener("change", () => {
        selectFile(elements.fileInput.files[0] || null);
      });

      for (const eventName of ["dragenter", "dragover"]) {
        elements.dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.dropzone.classList.add("dragover");
        });
      }
      for (const eventName of ["dragleave", "drop"]) {
        elements.dropzone.addEventListener(eventName, (event) => {
          event.preventDefault();
          elements.dropzone.classList.remove("dragover");
        });
      }
      elements.dropzone.addEventListener("drop", (event) => {
        const file = event.dataTransfer.files[0] || null;
        selectFile(file);
      });

      loadSettings();
      writeLog("Клиент готов.");
    </script>
  </body>
</html>
